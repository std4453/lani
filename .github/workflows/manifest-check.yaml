name: Build manifest
on:
  pull_request:
    branches: [next]
  push:
    branches: [next]
permissions:
  contents: read
jobs:
  manifest-check:
    name: manifest-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate the complete candidate tree
        run: node common/scripts/build-fingerprints.cjs check --ref "$(git rev-parse HEAD)"
