name: "@lani/all-in-one Pipeline"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to trigger workflow"
        required: false
        default: "master"

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build_generic.yaml
    with:
      ref: ${{ inputs.ref }}
      app: "@lani/all-in-one"
