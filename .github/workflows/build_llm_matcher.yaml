name: Build external LLM matcher

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      fingerprint:
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Validate identity
        id: identity
        env:
          FINGERPRINT: ${{ inputs.fingerprint }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          node - <<'JS'
          const fs = require('fs');
          const {execFileSync} = require('child_process');
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          const {manifest} = require('./common/scripts/build-fingerprints.cjs').check(revision);
          if (manifest.images['llm-matcher'].fingerprint !== process.env.FINGERPRINT)
            throw new Error('Invalid external matcher artifact identity');
          const image = `ghcr.io/${process.env.REPOSITORY_OWNER.toLowerCase()}/lani-llm-matcher`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `revision=${revision}\nimage=${image}\n`);
          JS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: libs/llm-matcher
          push: true
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            dev.lani.fingerprint=${{ inputs.fingerprint }}
            dev.lani.build-run=${{ github.run_id }}
            dev.lani.build-attempt=${{ github.run_attempt }}
          tags: ${{ steps.identity.outputs.image }}:fp-${{ inputs.fingerprint }}
          cache-from: type=gha,scope=llm-matcher
          cache-to: type=gha,mode=max,scope=llm-matcher
      - name: Record artifact
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          FINGERPRINT: ${{ inputs.fingerprint }}
        run: |
          printf 'External matcher: `%s`, fingerprint: `%s`, digest: `%s`\n' "$IMAGE" "$FINGERPRINT" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
