name: "Deploy to Kubernetes"

# Deployment only consumes immutable outputs of the build pipeline.
on:
  workflow_call:
    inputs:
      release_plan:
        type: string
        required: true
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ${{ inputs.environment }}
    concurrency:
      group: lani-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RELEASE_PLAN: ${{ inputs.release_plan }}
      DEPLOY_ENV: ${{ inputs.environment }}
      RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
      KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION }}
      DEPLOY_REF: ${{ vars.DEPLOY_REF }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          case "$DEPLOY_ENV" in offline|online) ;; *) exit 1 ;; esac
          test -n "$KUBE_CONTEXT"
          [[ "$KUBECTL_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          repository: std4453/lani-deploy
          ref: ${{ env.DEPLOY_REF }}
          token: ${{ secrets.DEPLOY_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install and build deployment tooling
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Prepare kubeconfig
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          umask 077
          config_file="$RUNNER_TEMP/lani-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$KUBECONFIG_CONTENT" > "$config_file"
          echo "KUBECONFIG=$config_file" >> "$GITHUB_ENV"

      - name: Save immutable release plan
        run: |
          node -e 'require("fs").writeFileSync("release-plan.json", process.env.RELEASE_PLAN, {mode: 0o600})'

      - name: Acquire lock, preflight and save release state
        run: >-
          yarn deploy prepare --plan release-plan.json --environment "$DEPLOY_ENV"
          --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Close entry and stop backends (skip for admin-only)
        run: >-
          yarn deploy quiesce --plan release-plan.json --environment "$DEPLOY_ENV"
          --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Run Prisma migrate deploy once (skip for admin-only)
        run: >-
          yarn deploy migrate --plan release-plan.json --environment "$DEPLOY_ENV"
          --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Deploy selected applications and wait for readiness
        run: >-
          yarn deploy apply --plan release-plan.json --environment "$DEPLOY_ENV"
          --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Confirm rollout, restore entry if gated, complete and release lock
        run: >-
          yarn deploy finish --plan release-plan.json --environment "$DEPLOY_ENV"
          --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Collect release evidence (read-only)
        if: always()
        run: |
          if [ -f release-plan.json ] && [ -f dist/deploy.js ] && [ -n "${KUBECONFIG:-}" ]; then
            yarn deploy report --plan release-plan.json --environment "$DEPLOY_ENV" \
              --release "$RELEASE_ID" --context "$KUBE_CONTEXT"
          fi

      - name: Publish credential-free release summary
        if: always()
        shell: bash
        run: |
          report="generated/releases/$RELEASE_ID/report.json"
          if [ -f "$report" ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove kubeconfig
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/lani-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
