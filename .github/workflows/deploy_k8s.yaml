name: "Deploy to Kubernetes"

# Deployment only consumes immutable outputs of the build pipeline.
on:
  workflow_call:
    inputs:
      project_name:
        type: string
        required: true
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
      migration_image:
        type: string
        default: ""
      revision:
        type: string
        required: true
      migration_revision:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: lani-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      DEPLOY_ENV: ${{ inputs.environment }}
      APP_IMAGE: ${{ inputs.image }}
      MIGRATION_IMAGE: ${{ inputs.migration_image }}
      REVISION: ${{ inputs.revision }}
      MIGRATION_REVISION: ${{ inputs.migration_revision }}
      RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      KUBE_CONTEXT: ${{ vars.KUBE_CONTEXT }}
      KUBECTL_VERSION: ${{ vars.KUBECTL_VERSION }}
      DEPLOY_REF: ${{ vars.DEPLOY_REF }}
      LANI_BACKUP_REFERENCE: ${{ vars.LANI_BACKUP_REFERENCE }}
      LANI_MIGRATION_NETWORK: ${{ vars.LANI_MIGRATION_NETWORK }}
      LANI_VERIFY_QUERY: ${{ vars.LANI_VERIFY_QUERY }}
      LANI_VERIFY_TOKEN: ${{ secrets.LANI_VERIFY_TOKEN }}
    steps:
      - name: Validate release inputs
        shell: bash
        run: |
          case "$PROJECT_NAME" in @lani/admin|@lani/api-server|@lani/data-server|@lani/gateway) ;; *) exit 1 ;; esac
          case "$DEPLOY_ENV" in offline|online) ;; *) exit 1 ;; esac
          test -n "$KUBE_CONTEXT"
          [[ "$KUBECTL_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DEPLOY_REF" =~ ^[0-9a-f]{40}$ ]]
          if [ "$PROJECT_NAME" != '@lani/admin' ]; then
            test "$REVISION" = "$MIGRATION_REVISION"
            test -n "$MIGRATION_IMAGE"
          fi

      - name: Checkout deployment tooling
        uses: actions/checkout@v4
        with:
          repository: std4453/lani-deploy
          ref: ${{ env.DEPLOY_REF }}
          token: ${{ secrets.DEPLOY_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: Install and build deployment tooling
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Prepare kubeconfig
        shell: bash
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_CONTENT"
          umask 077
          config_file="$RUNNER_TEMP/lani-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$KUBECONFIG_CONTENT" > "$config_file"
          echo "KUBECONFIG=$config_file" >> "$GITHUB_ENV"

      - name: Deploy release
        shell: bash
        run: |
          yarn deploy --app "${PROJECT_NAME##*/}" --environment "$DEPLOY_ENV" \
            --image "$APP_IMAGE" --migration-image "$MIGRATION_IMAGE" \
            --revision "$REVISION" --migration-revision "$MIGRATION_REVISION" \
            --release "$RELEASE_ID" --context "$KUBE_CONTEXT"

      - name: Publish credential-free release summary
        if: always()
        shell: bash
        run: |
          report="generated/releases/$RELEASE_ID/report.json"
          if [ -f "$report" ]; then
            printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove kubeconfig
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/lani-kubeconfig-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
