name: "Default Pipeline"

on:
  push:
    branches: [next]
  workflow_dispatch:
    inputs:
      ref:
        description: Source ref (resolved once for the entire release)
        required: true
        default: next
      apps:
        description: "Comma-separated applications: admin,api-server,data-server,gateway"
        type: string
        required: false
      project_name:
        description: Legacy single package; use either this input or apps
        type: string
        required: false
      environment:
        description: Deployment environment
        type: choice
        options: [online]
        required: true
        default: online

# All fingerprint publishers enter this queue before planning.
concurrency:
  group: lani-fingerprint-pipeline
  queue: max
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  plan:
    if: github.ref == 'refs/heads/next'
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      revision: ${{ steps.plan.outputs.revision }}
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
      reused: ${{ steps.plan.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Resolve source and plan missing images
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APPS: ${{ inputs.apps || (!inputs.project_name && 'admin,api-server,data-server,gateway') || '' }}
          LEGACY_PROJECT: ${{ inputs.project_name }}
        working-directory: source
        run: node ../.github/scripts/release-plan.cjs select

  images:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_generic.yaml
    with:
      ref: ${{ needs.plan.outputs.revision }}
      project_name: ${{ format('@lani/{0}', matrix.app) }}
      artifact_name: build-${{ matrix.app }}-${{ github.run_attempt }}
      fingerprint: ${{ matrix.fingerprint }}

  publish:
    needs: [plan, images]
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.revision }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.app }}-${{ github.run_attempt }}
          path: build-result
      - name: Validate build result
        id: digest
        env:
          APP: ${{ matrix.app }}
          FINGERPRINT: ${{ matrix.fingerprint }}
          SOURCE_SHA: ${{ needs.plan.outputs.revision }}
        run: node common/scripts/fingerprint-images.cjs build-result "$APP" "$FINGERPRINT"
      - name: Bind actual checked-out inputs to the image
        env:
          APP: ${{ matrix.app }}
          FINGERPRINT: ${{ matrix.fingerprint }}
        run: node common/scripts/fingerprint-images.cjs predicate "$APP" "$FINGERPRINT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.digest.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          predicate-type: https://lani.dev/build/v1
          predicate-path: predicate.json
          push-to-registry: true
          create-storage-record: false
      - name: Publish fingerprint only after provenance verification
        env:
          APP: ${{ matrix.app }}
          FINGERPRINT: ${{ matrix.fingerprint }}
          BUILD_IMAGE: ${{ steps.digest.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: node common/scripts/fingerprint-images.cjs publish "$APP" "$FINGERPRINT"
      - name: Export selected image
        env:
          APP: ${{ matrix.app }}
          FINGERPRINT: ${{ matrix.fingerprint }}
          IMAGE_BUILT: "true"
          GH_TOKEN: ${{ github.token }}
        run: node common/scripts/fingerprint-images.cjs result "$APP" "$FINGERPRINT"
      - uses: actions/upload-artifact@v4
        with:
          name: fingerprint-${{ matrix.app }}-${{ github.run_attempt }}
          path: ${{ matrix.app }}.json
          if-no-files-found: error
          retention-days: 7

  assembly:
    needs: [plan, images, publish]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
      ((needs.images.result == 'success' && needs.publish.result == 'success') ||
      (needs.images.result == 'skipped' && needs.publish.result == 'skipped' &&
      needs.plan.outputs.matrix == '[]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.assembly.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.matrix != '[]'
        with:
          pattern: fingerprint-*-${{ github.run_attempt }}
          path: results
          merge-multiple: true
      - name: Assemble complete selected image set
        id: assembly
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          IMAGES: ${{ needs.plan.outputs.images }}
          REUSED: ${{ needs.plan.outputs.reused }}
        run: node .github/scripts/release-plan.cjs assemble

  notify:
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/next' &&
      needs.assembly.result == 'success' && needs.assembly.outputs.built == 'true' }}
    needs: [plan, assembly]
    runs-on: ubuntu-latest
    permissions: {}
    environment: cd-notify
    steps:
      # No checkout, artifact execution, or inherited build secrets in this job.
      - name: Submit private deployment request or print manual handoff
        uses: actions/github-script@v7
        env:
          NOTIFY_ENABLED: ${{ vars.PRIVATE_CD_ENABLED }}
          SOURCE_EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ needs.plan.outputs.revision }}
          RELEASE_APPS: ${{ join(fromJSON(needs.plan.outputs.apps), ',') }}
          TARGET_REPOSITORY: ${{ vars.PRIVATE_CD_REPOSITORY }}
          PRIVATE_CD_TOKEN: ${{ secrets.PRIVATE_CD_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const inputs = {
              protocolVersion: '2',
              sourceRepository: context.repo.owner + '/' + context.repo.repo,
              sourceSha: process.env.SOURCE_SHA,
              buildRunId: String(context.runId),
              buildRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
              applications: process.env.RELEASE_APPS,
              environment: 'online',
              automatic: 'false'
            };
            let message = 'Deployment request not confirmed; dispatch the private release workflow manually with these inputs.';
            if (process.env.NOTIFY_ENABLED === 'true' && process.env.SOURCE_EVENT === 'push') {
              try {
                if (!process.env.PRIVATE_CD_TOKEN) throw new Error('Missing notification credential');
                const target = process.env.TARGET_REPOSITORY || '';
                if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(target)) throw new Error('Invalid target');
                const result = await fetch(`https://api.github.com/repos/${target}/actions/workflows/release.yaml/dispatches`, {
                  method: 'POST',
                  headers: {
                    Authorization: `Bearer ${process.env.PRIVATE_CD_TOKEN}`,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28'
                  },
                  body: JSON.stringify({ref: 'main', inputs: {...inputs, automatic: 'true'}}),
                  signal: AbortSignal.timeout(30000)
                });
                if (!result.ok) throw new Error('Dispatch rejected');
                message = 'Deployment request submitted. Build success does not mean deployment success; inspect the private workflow.';
              } catch {
                core.setFailed('Build artifacts succeeded, but deployment request submission is unconfirmed. Manual resubmission uses the same request identity.');
              }
            }
            await core.summary.addRaw(message + '\n').addCodeBlock(JSON.stringify(inputs, null, 2), 'json').write();
