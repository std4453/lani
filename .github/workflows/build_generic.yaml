name: "Generic App Build"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to trigger workflow"
        required: false
        default: "master"
      app:
        description: "Project package name"
        required: true

  workflow_call:
    inputs:
      ref:
        type: string
        description: "Ref to trigger workflow"
        required: false
        default: "master"
      app:
        type: string
        description: "Project package name"
        required: true

      fingerprint:
        type: string
        description: Optional immutable build input identity
        default: ""

    outputs:
      image:
        description: Immutable image reference from this build
        value: ${{ jobs.build.outputs.image }}
      revision:
        description: Checked out source commit
        value: ${{ jobs.build.outputs.revision }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.app }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.result.outputs.image }}
      revision: ${{ steps.build_info.outputs.revision }}
    env:
      PROJECT_NAME: ${{ inputs.app }}
      # Prisma 3 uses OpenSSL 1.1 in the migration runtime, independent of the runner.
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-1.1.x
    steps:
      - name: Validate project
        shell: bash
        run: |
          case "$PROJECT_NAME" in
            @lani/admin|@lani/api-server|@lani/data-server|@lani/gateway|@lani/db|@lani/all-in-one) ;;
            *) echo "Unsupported project" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        name: Checkout
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3
        name: Setup Docker Buildx

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        name: Setup Node
        with:
          node-version: "20"

      # https://github.com/microsoft/rushstack/issues/1847#issuecomment-993825253

      - name: Cache Rush
        uses: actions/cache@v4
        with:
          path: |
            common/temp/install-run
          key: ${{ runner.os }}-${{ hashFiles('rush.json') }}

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: |
            common/temp/pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Dependencies
        run: |
          node common/scripts/install-run-rush.js install --no-link

      - name: Link Dependencies
        run: |
          node common/scripts/install-run-rush.js link

      - name: Build
        env:
          # Umi 3's bundled Webpack uses legacy hashes unavailable in OpenSSL 3.
          # Keep this compatibility option scoped to the build process.
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          node common/scripts/install-run-rush.js build -t "$PROJECT_NAME" -p 1 -v

      - name: Rush Deploy
        run: |
          node common/scripts/install-run-rush.js deploy -p "$PROJECT_NAME"

      - name: Build Info
        id: build_info
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          app="${PROJECT_NAME##*/}"
          if [ "$app" = db ]; then directory=libs/db; else directory="apps/$app"; fi
          {
            echo "dockerfile_path=$directory/Dockerfile"
            echo "image_name=ghcr.io/${REPOSITORY_OWNER,,}/lani-$app"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          file: ${{ steps.build_info.outputs.dockerfile_path }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.build_info.outputs.revision }}
            dev.lani.fingerprint=${{ inputs.fingerprint }}
            dev.lani.build-run=${{ github.run_id }}
            dev.lani.build-attempt=${{ github.run_attempt }}
          tags: |
            ${{ steps.build_info.outputs.image_name }}:${{ steps.build_info.outputs.revision }}
            ${{ steps.build_info.outputs.image_name }}:run-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ steps.build_info.outputs.image_name }}:latest
            ${{ inputs.fingerprint && format('{0}:fp-{1}', steps.build_info.outputs.image_name, inputs.fingerprint) || '' }}

      - name: Export immutable build result
        id: result
        env:
          IMAGE_NAME: ${{ steps.build_info.outputs.image_name }}
          IMAGE_DIGEST: ${{ steps.docker_build.outputs.digest }}
        run: echo "image=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
