name: Anime matcher

on:
  pull_request:
    branches: [next]
    paths:
      - "libs/anime-matcher/**"
      - ".github/workflows/anime-matcher.yaml"
  push:
    branches: [next]
    paths:
      - "libs/anime-matcher/**"
      - ".github/workflows/anime-matcher.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Build independent Python wheel
        working-directory: libs/anime-matcher
        run: |
          python -m pip install build
          python -m build --outdir build/python
          python -m pip install build/python/*.whl
      - name: Test Python inference and protocols
        run: python -m unittest discover -s libs/anime-matcher/tests -p 'test_*.py' -v
      - name: Build and test standalone npm client
        working-directory: libs/anime-matcher
        env:
          MATCHER_TEST_PYTHON: python
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
          npm test
      - name: Build standalone lexical container
        run: docker build -t lani-anime-matcher:test libs/anime-matcher
