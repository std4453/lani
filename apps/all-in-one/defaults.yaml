s3:
  credentials:
    accessKeyId: minioadmin
    secretAccessKey: minioadmin
  region: ""
  bucket: images
  endpoint: http://127.0.0.1:9000
  s3ForcePathStyle: true
  publicHost: /api/storage/images/
  proxyEnabled: true

# 默认词法推理，不含神经模型权重；配置可切换外部 worker 或关闭匹配。
matching:
  enabled: true
  endpoint: http://127.0.0.1:8090

imageProxy:
  upstream: http://127.0.0.1:9000/images/

subgraphs:
  - name: data
    url: http://localhost:8083/graphql
  - name: api
    url: http://localhost:8082/graphql
  
postgraphile:
  setofFunctionsContainNulls: true
  ignoreRBAC: true
  showErrorStack: json
  extendedErrors:
    - hint
    - detail
    - errcode
  graphiql: false
  allowExplain: false
  watchPg: false
