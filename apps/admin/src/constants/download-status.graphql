fragment taskStatusFields on Task {
  id
  type
  legacyStage
  isFailed
  isCancelled
  workflow
  version
}

fragment episodeStatusFields on Episode {
  jellyfinEpisodeId
  airTime
  id
  tasks: tasksByEpisodeId(first: 1, orderBy: ID_DESC) {
    edges {
      node {
        ...taskStatusFields
      }
    }
  }
}
