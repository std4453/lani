fragment taskStatusFields on Task {
  id
  type
  legacyStage
  isFailed
  isCancelled
  workflow
  version
}

fragment episodeStatusFields on Episode {
  jellyfinEpisodeId
  airTime
  id
  tasks: tasksByEpisodeId(first: 1, orderBy: ID_DESC) {
    edges {
      node {
        ...taskSummaryFields
      }
    }
  }
}

fragment taskSummaryFields on Task {
  id
  type
  statusSummary {
    version
    workflow {
      status
      currentStepId
      steps {
        id
        atom
        title
        status
      }
    }
    legacy {
      stage
      isFailed
      isCancelled
    }
  }
}

query GetTaskSummaries($taskIds: [Int!]!) {
  allTasks(filter: { id: { in: $taskIds } }) {
    nodes {
      ...taskSummaryFields
    }
  }
}
