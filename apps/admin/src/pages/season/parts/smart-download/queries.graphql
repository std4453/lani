query SmartDownloadPreview(
  $seasonId: Int!
  $first: Int!
  $snapshot: String!
  $after: String
  $from: String
  $before: String
) {
  smartDownloadPreview(
    seasonId: $seasonId
    first: $first
    snapshot: $snapshot
    after: $after
    from: $from
    before: $before
  )
}

query SmartDownloadState($seasonId: Int!) {
  smartDownloadTasks(seasonId: $seasonId)
  config {
    matching {
      enabled
      backend
      mode
    }
  }
}
