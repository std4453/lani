fragment cardSeasonFields on Season {
  id
  title
  isMonitoring
  poster: imageByPosterImageId {
    ...displayImageFields
  }
  mainEpisodes {
    edges {
      node {
        title
        numbering
        ...episodeStatusFields
      }
    }
  }
}

query ListSeasonCards($offset: Int!, $first: Int!, $filter: SeasonFilter) {
  allSeasons(
    offset: $offset
    first: $first
    orderBy: ID_DESC
    filter: $filter
  ) {
    totalCount
    edges {
      node {
        ...cardSeasonFields
      }
    }
  }
}

fragment listSeasonsFields on Season {
  bangumiId
  airTime
  weekday
  isMonitoring
  jellyfinFolderByJellyfinFolderId {
    name
  }
  title
  id
  yearAndSemester
  tvdbId
  tvdbSeason
  bilibiliThmId
  bilibiliMainlandId
  jellyfinId
  allEpisodes: mainEpisodes {
    totalCount
  }
  airedEpisodes: mainEpisodes(
    filter: { airTime: { lessThanOrEqualTo: $now } }
  ) {
    totalCount
  }
  availableEpisodes: mainEpisodes(
    filter: { jellyfinEpisodeId: { isNull: false } }
  ) {
    totalCount
  }
  firstEpisode: mainEpisodes(first: 1) {
    edges {
      node {
        airTime
      }
    }
  }
  nextEpisode: mainEpisodes(
    first: 1
    filter: { airTime: { greaterThanOrEqualTo: $now } }
  ) {
    edges {
      node {
        airTime
      }
    }
  }
  latestEpisode: latestMainEpisode(atTime: $now) {
    ...episodeStatusFields
  }
}

query ListSeasons(
  $offset: Int
  $first: Int
  $orderBy: [SeasonsOrderBy!] = []
  $filter: SeasonFilter
  $now: Datetime!
) {
  allSeasons(
    offset: $offset
    first: $first
    orderBy: $orderBy
    filter: $filter
  ) {
    pageInfo {
      hasNextPage
    }
    totalCount
    edges {
      node {
        ...listSeasonsFields
      }
      cursor
    }
  }
}

mutation CreateSeason($season: SeasonInput!) {
  createSeason(input: { season: $season }) {
    season {
      id
    }
  }
}

query SearchBangumi($keywords: String!, $useNewBangumiSearchApi: Boolean) {
  searchBangumi(
    keywords: $keywords
    useNewBangumiSearchApi: $useNewBangumiSearchApi
  ) {
    added
    airDate
    id
    image
    name
  }
}

fragment jellyfinFolderFields on JellyfinFolder {
  id
  name
  location
  isHidden
  isDefault
}

query GetMetadataPageOptions {
  getAvailableSemesters
  allJellyfinFolders {
    edges {
      node {
        ...jellyfinFolderFields
      }
    }
  }
}

mutation DeleteSeasonById($id: Int!) {
  deleteSeasonById(id: $id)
}

query ListJellyfinFolders {
  allJellyfinFolders {
    edges {
      node {
        ...jellyfinFolderFields
      }
    }
  }
}

mutation WriteSeasonMetadata($id: Int!) {
  writeMetadata(seasonId: $id)
}

query GetSeasonsStatus($seasonIds: [Int!]!, $now: Datetime!) {
  allSeasons(filter: { id: { in: $seasonIds } }) {
    edges {
      node {
        id
        latestEpisode: latestMainEpisode(atTime: $now) {
          ...episodeStatusFields
        }
      }
    }
  }
}
