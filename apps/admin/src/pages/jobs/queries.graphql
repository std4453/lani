fragment listTasksFields on Task {
  id
  type
  legacyStage
  isFailed
  isCancelled
  workflow
  version
  jellyfinEpisodeId
  episodeByEpisodeId {
    id
    airTime
    title
    index
    numbering
    seasonBySeasonId {
      id
      title
    }
  }
  createdAt
  failedReason
}

query ListTasks($offset: Int, $first: Int, $filter: TaskFilter) {
  allTasks(offset: $offset, first: $first, filter: $filter, orderBy: ID_DESC) {
    pageInfo {
      hasNextPage
    }
    totalCount
    edges {
      node {
        ...listTasksFields
      }
      cursor
    }
  }
}

query GetTaskPageSignature($offset: Int, $first: Int, $filter: TaskFilter) {
  allTasks(offset: $offset, first: $first, filter: $filter, orderBy: ID_DESC) {
    totalCount
    edges {
      node {
        id
      }
    }
  }
}
