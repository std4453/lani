fragment listDownloadJobsFields on DownloadJob {
  id
  type
  status
  isFailed
  isCancelled
  workflow
  version
  jellyfinEpisodeId
  episodeByEpisodeId {
    id
    airTime
    title
    index
    numbering
    seasonBySeasonId {
      id
      title
    }
  }
  createdAt
  failedReason
}

query ListDownloadJobs($offset: Int, $first: Int, $filter: DownloadJobFilter) {
  allDownloadJobs(
    offset: $offset
    first: $first
    filter: $filter
    orderBy: ID_DESC
  ) {
    pageInfo {
      hasNextPage
    }
    totalCount
    edges {
      node {
        ...listDownloadJobsFields
      }
      cursor
    }
  }
}
