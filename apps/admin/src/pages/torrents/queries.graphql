fragment torrentFields on Torrent {
  id
  displayId
  channel
  permalink
  publishDate
  size
  title
  torrentLink
  episodeInfo
  subtitleInfo
}

fragment torrentParseFields on Torrent {
  organizationParts
  seasonTitleAliases
}

query ListTorrents(
  $offset: Int
  $first: Int
  $orderBy: [TorrentsOrderBy!] = []
  $filter: TorrentFilter
) {
  allTorrents(
    offset: $offset
    first: $first
    orderBy: $orderBy
    filter: $filter
  ) {
    edges {
      node {
        ...torrentFields
        ...torrentParseFields
      }
      cursor
    }
    pageInfo {
      hasNextPage
    }
    totalCount
  }
}

mutation SyncTorrentHistory {
  syncTorrentHistory
}

query TorrentHistorySyncStatus($id: String!) {
  torrentHistorySync(id: $id) {
    running
    error
  }
}
