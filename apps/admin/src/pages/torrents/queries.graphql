fragment torrentFields on Torrent {
  id
  displayId
  channel
  permalink
  publishDate
  size
  title
  torrentLink
  episodeInfo
  subtitleInfo
}

fragment torrentParseFields on Torrent {
  organizationParts
  seasonTitleAliases
}

query ListTorrents(
  $offset: Int
  $first: Int
  $orderBy: [TorrentsOrderBy!] = []
  $filter: TorrentFilter
) {
  allTorrents(
    offset: $offset
    first: $first
    orderBy: $orderBy
    filter: $filter
  ) {
    edges {
      node {
        ...torrentFields
        ...torrentParseFields
      }
      cursor
    }
    pageInfo {
      hasNextPage
    }
    totalCount
  }
}

mutation SyncMikanHistory {
  syncMikanHistory
}

fragment nyaaHistorySyncFields on NyaaHistorySync {
  id
  running
  added
  error
}

mutation SyncNyaaHistory {
  syncNyaaHistory {
    ...nyaaHistorySyncFields
  }
}

query NyaaHistorySyncStatus {
  nyaaHistorySync {
    ...nyaaHistorySyncFields
  }
}
