query GetEpisodeById($episodeByIdId: Int!) {
  episodeById(id: $episodeByIdId) {
    ...episodeDetailsFields
  }
}

fragment episodeDetailsFields on Episode {
  rawAirTime
  airTime
  createdAt
  description
  tasksByEpisodeId(orderBy: ID_DESC) {
    edges {
      node {
        ...taskDetailsFields
      }
    }
  }
  id
  index
  numbering
  jellyfinEpisodeId
  seasonBySeasonId {
    id
    title
    downloadOffsetHours
  }
  title
}

query GetTaskById($id: Int!) {
  taskById(id: $id) {
    ...taskDetailsFields
    episodeByEpisodeId {
      ...episodeDetailsFields
    }
  }
}
