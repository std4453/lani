query GetEpisodeById($episodeByIdId: Int!) {
  episodeById(id: $episodeByIdId) {
    ...episodeDetailsFields
  }
}

query GetEpisodeNavigation($episodeId: Int!) {
  episodeById(id: $episodeId) {
    id
    seasonBySeasonId {
      id
      episodesBySeasonId(orderBy: INDEX_ASC) {
        edges {
          node {
            id
            numbering
          }
        }
      }
    }
  }
}

fragment episodeDetailsFields on Episode {
  rawAirTime
  airTime
  createdAt
  description
  tasksByEpisodeId(orderBy: ID_DESC) {
    edges {
      node {
        ...taskDetailsFields
      }
    }
  }
  id
  index
  numbering
  jellyfinEpisodeId
  seasonBySeasonId {
    id
    title
    downloadOffsetHours
  }
  title
}

query GetTaskById($id: Int!) {
  taskById(id: $id) {
    ...taskDetailsFields
    episodeByEpisodeId {
      ...episodeDetailsFields
    }
  }
}
