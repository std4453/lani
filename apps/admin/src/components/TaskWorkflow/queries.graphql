query GetDownloadJobStates($jobIds: [Int!]!) {
  getDownloadJobStates(jobIds: $jobIds) {
    id
    type
    version
    workflow
    status
    isFailed
    isCancelled
    failedReason
    canRetry
    canCancel
    qbtTorrentHash
    torrentTitle
    downloadPath
    importPath
    filePath
    nfoPath
    jellyfinEpisodeId
  }
}
mutation CancelDownloadJob($jobId: Int!) {
  cancelDownloadJob(jobId: $jobId)
}
