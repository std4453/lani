fragment taskDetailsFields on Task {
  taskEpisodesByTaskId(orderBy: POSITION_ASC) {
    nodes {
      id
      episodeId
      sourcePath
      importPath
      filePath
      nfoPath
      jellyfinEpisodeId
      episodeByEpisodeId {
        id
        title
        numbering
        seasonBySeasonId {
          id
          title
          jellyfinId
        }
      }
    }
  }

  type
  episodeId
  createdAt
  downloadPath
  failedAt
  failedReason
  filePath
  id
  importPath
  isFailed
  isCancelled
  workflow
  version
  nfoPath
  qbtTorrentHash
  legacyStage
  torrentLink
  jellyfinEpisodeId
  torrentTitle
}

query GetTaskStates($taskIds: [Int!]!) {
  getTaskStates(taskIds: $taskIds) {
    id
    type
    entries {
      id
      episodeId
      sourcePath
      importPath
      filePath
      nfoPath
      jellyfinEpisodeId
    }
    version
    workflow
    legacyStage
    isFailed
    isCancelled
    failedReason
    canRetry
    canCancel
    qbtTorrentHash
    torrentTitle
    downloadPath
    importPath
    filePath
    nfoPath
    jellyfinEpisodeId
  }
}
mutation CancelTask($taskId: Int!) {
  cancelTask(taskId: $taskId)
}

mutation RetryTask($taskId: Int!) {
  retryTask(taskId: $taskId)
}

query GetDownloadProgress($taskIds: [Int!]!) {
  getDownloadProgress(taskIds: $taskIds) {
    downloaded
    eta
    id
    peers
    seeds
    speed
    total
  }
}
