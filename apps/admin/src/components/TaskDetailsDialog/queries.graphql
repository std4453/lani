fragment taskDetailsFields on DownloadJob {
  type
  episodeId
  createdAt
  downloadPath
  failedAt
  failedReason
  filePath
  id
  importPath
  isFailed
  isCancelled
  workflow
  version
  nfoPath
  qbtTorrentHash
  status
  torrentLink
  jellyfinEpisodeId
  torrentTitle
}

query GetTaskById($id: Int!) {
  downloadJobById(id: $id) {
    ...taskDetailsFields
  }
}

query GetTaskEpisode($id: Int!) {
  episodeById(id: $id) {
    id
    title
    numbering
    rawAirTime
    airTime
    description
    seasonBySeasonId {
      id
      title
    }
  }
}
