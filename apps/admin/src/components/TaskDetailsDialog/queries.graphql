fragment taskDetailsFields on DownloadJob {
  type
  episodeId
  createdAt
  downloadPath
  failedAt
  failedReason
  filePath
  id
  importPath
  isFailed
  isCancelled
  workflow
  version
  nfoPath
  qbtTorrentHash
  status
  torrentLink
  jellyfinEpisodeId
  torrentTitle
}

query GetTaskById($id: Int!) {
  downloadJobById(id: $id) {
    ...taskDetailsFields
  }
}
