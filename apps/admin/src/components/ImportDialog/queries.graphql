query ListFiles($path: String!) {
  listFiles(path: $path) {
    lastModified
    name
    path
    size
    type
  }
}

mutation ImportSingle($episodeId: Int!, $path: String!) {
  importSingle(episodeId: $episodeId, importPath: $path)
}

mutation ImportMultiple($entries: [ImportMultipleEntry!]!) {
  importMultiple(entries: $entries)
}

query GetImportSeason($id: Int!, $offset: Int!) {
  seasonById(id: $id) {
    id
    title
    episodesBySeasonId(first: 100, offset: $offset, orderBy: ID_ASC) {
      totalCount
      nodes {
        id
        title
        index
        numbering
        ...episodeStatusFields
        matchingTasks: tasksByEpisodeId {
          nodes {
            ...taskStatusFields
          }
        }
      }
    }
  }
}
