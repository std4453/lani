query SearchTorrent($keyword: String!, $first: Int!, $offset: Int = 0) {
  allTorrents(
    filter: { title: { includesInsensitive: $keyword } }
    first: $first
    offset: $offset
    orderBy: PUBLISH_DATE_DESC
  ) {
    edges {
      node {
        ...torrentFields
      }
    }
    totalCount
  }
}
