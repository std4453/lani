server {
    listen 8080;
    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # 只有文件名带内容 hash 的资源可以长期缓存；缺失文件不能回退为 HTML。
    location ~ "\.[0-9a-f]{8,}\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        error_page 404 = @asset_not_found;
    }

    # favicon 路径固定，短期缓存后通过 ETag / Last-Modified 重新验证。
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
        error_page 404 = @asset_not_found;
    }

    location @asset_not_found {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
