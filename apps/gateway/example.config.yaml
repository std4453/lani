# 本地开发时复制到 config.yaml，按自己的依赖填写；不要提交实际凭据。
subgraphs:
  - name: data
    url: http://localhost:8083/graphql
  - name: api
    url: http://localhost:3000/graphql

# 可选：轮询 subgraph schema；生产是否启用由部署配置决定。
debug:
  pollIntervalInMs: 3000

# OIDC discovery 地址和浏览器公开客户端 ID。
auth:
  enabled: true
  authority: https://your_oidc_authority
  clientId: your_public_client_id
  # 按需用 JMESPath 检查 JWT claims；仅 issuer 校验不等于业务授权。
  authz:
    enabled: true
    query: "contains(groups, 'your_admin_group')"
    result: true
  clientConfig:
    scope: openid profile

# 隔离开发环境可用 auth: { enabled: false } 关闭鉴权。
