[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lani-llm-matcher"
version = "0.1.0"
description = "External chat-completions season matcher for lani"
requires-python = ">=3.11"

[project.scripts]
lani-llm-matcher = "lani_llm_matcher.worker:main"

[tool.setuptools.package-data]
lani_llm_matcher = ["prompts/*.txt"]
