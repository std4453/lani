services:
  anime-matcher:
    build:
      context: .
      args:
        VARIANT: lexical
        WITH_MODELS: "false"
    ports:
      - "127.0.0.1:8090:8090"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 4g
    cpus: 4
    # CPU 语义：VARIANT=semantic-cpu、WITH_MODELS=true、mem_limit=8g。
    # CUDA 语义：VARIANT=semantic-cu126、WITH_MODELS=true，另配置 GPU 设备预留。
    # CUDA 镜像在无 GPU 主机可显式使用 command: ["--device", "cpu"]。
    # 外部权重是可选项，不要覆盖默认 /opt/lani/models：
    # command: ["--model-dir", "/external-models"]
    # volumes: ["./models:/external-models:ro"]
